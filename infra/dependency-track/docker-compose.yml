services:
  dtrack-apiserver:
    image: dependencytrack/apiserver:4.13.0
    container_name: dtrack-apiserver
    ports:
      - "8081:8080"
    environment:
      ALPINE_DATABASE_MODE: "embedded"
    volumes:
      - dtrack-data:/data
    restart: unless-stopped

  dtrack-frontend:
    image: dependencytrack/frontend:4.13.0
    container_name: dtrack-frontend
    depends_on:
      - dtrack-apiserver
    ports:
      - "8082:8080"
    environment:
      API_BASE_URL: "http://localhost:8081"
    restart: unless-stopped

volumes:
  dtrack-data:
